[thresholds]
complexity = 8
duplication = 20
max_file_length = 500
max_function_length = 30
min_score_threshold = 2.0

[thresholds.validation]
max_average_complexity = 7.0
max_debt_density = 30.0
max_codebase_risk_score = 5.0
min_coverage_percentage = 0.0
max_total_debt_score = 100

[languages]
enabled = ["rust"]

[languages.rust]
detect_dead_code = false
detect_complexity = true
detect_duplication = true

[ignore]
patterns = ["target/**"]
