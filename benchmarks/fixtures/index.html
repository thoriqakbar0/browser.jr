<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser control benchmark</title>
    <style>
      body { width: 640px; margin: 24px; }
      label { display: block; width: 320px; margin: 8px 0; }
      input, select, button { width: 240px; }
    </style>
  </head>
  <body>
    <h1>Browser control benchmark</h1>
    <a id="continue" href="/next.html">Continue</a>
    <label for="agent-name">Agent name</label>
    <input id="agent-name" name="agent-name" type="text" value="">
    <label>
      <input id="terms" name="terms" type="checkbox">
      Accept terms
    </label>
    <label for="color">Color</label>
    <select id="color" name="color">
      <option value="red">Red</option>
      <option value="blue">Blue</option>
    </select>
    <button id="save" type="button">Save</button>
    <ul>
      <li>Alpha</li>
      <li>Beta</li>
      <li>Gamma</li>
    </ul>
  </body>
</html>
