[package]
name = "browser-jr"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "browser_jr"
path = "src/lib.rs"

[[bin]]
name = "browser-jr"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
bytes = "1.10"
http-body-util = "0.1.3"
hyper = { version = "1.7", features = ["client", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.47", features = ["io-util", "net", "rt", "time"] }
tokio-rustls = { version = "0.26.2", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0"
dom_query = { version = "0.28.0", default-features = false }
html5ever = "0.39.0"
http = "1.5.0"
png = "0.18.1"
serde_json = "1.0"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
url = "2.5.8"

[dev-dependencies]
rcgen = "0.14"
