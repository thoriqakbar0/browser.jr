[package]
name = "browser-jr"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "browser_jr"
path = "src/lib.rs"

[[bin]]
name = "browser-jr"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
dom_query = { version = "0.28.0", default-features = false }
html5ever = "0.39.0"
http = "1.5.0"
png = "0.18.1"
serde_json = "1.0"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
ureq = { version = "3.4.0", default-features = false }
